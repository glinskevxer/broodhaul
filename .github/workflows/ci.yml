name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npx eslint . --max-warnings 0

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npx prettier --check .

  test:
    name: test on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.18.2', '22.13.1', '24.0.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx vitest run --reporter=verbose

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npx vitest run --coverage

  dependencies:
    name: runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --omit=dev
      - name: refuse an unexpected runtime dependency
        run: |
          set -euo pipefail
          installed=$(node -e "const p=require('./package.json');console.log(Object.keys(p.dependencies).sort().join(','))")
          echo "runtime dependencies: $installed"
          if [ "$installed" != "commander" ]; then
            echo "the runtime dependency list changed, update this check on purpose"
            exit 1
          fi

  timezones:
    name: timezones
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: ['UTC', 'Pacific/Auckland', 'America/Los_Angeles', 'Asia/Kathmandu']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: install
        run: npm ci
      - name: run the suite under ${{ matrix.tz }}
        env:
          TZ: ${{ matrix.tz }}
        run: npx vitest run --reporter=dot

  worked-example:
    name: worked example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --omit=dev
      - name: run a season through the installed command
        run: |
          set -euo pipefail
          records=$(mktemp -d)
          node bin/broodhaul.js selftest
          node bin/broodhaul.js --root "$records" --actor ci --today 2025-03-20 example load
          node bin/broodhaul.js --root "$records" --actor ci --today 2025-03-20 check
          node bin/broodhaul.js --root "$records" --actor ci --today 2025-03-20 export all "$records/csv"
          node bin/broodhaul.js --root "$records" --actor ci --today 2025-03-20 print set-sheet CT-2025-0007
          test -f "$records/csv/gradings.csv"

  container:
    name: container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the image
        run: docker build -t broodhaul:ci .
      - name: run the worked season inside it
        run: |
          set -euo pipefail
          records=$(mktemp -d)
          chmod 777 "$records"
          docker run --rm -v "$records:/records" broodhaul:ci --actor ci --today 2025-03-20 example load
          docker run --rm -v "$records:/records" broodhaul:ci --actor ci --today 2025-03-20 check
          docker run --rm -v "$records:/records" broodhaul:ci --actor ci --today 2025-03-20 counts
          docker run --rm broodhaul:ci selftest
          test -f "$records/contracts/CT-2025-0007.json"
